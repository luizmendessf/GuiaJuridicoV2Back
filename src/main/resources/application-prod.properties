# Configurações para produção com banco de dados (via variáveis de ambiente)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

# Configurações JPA para produção
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configurações de conexão Hikari (ajustáveis via env)
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:60000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# Chave secreta para assinatura dos tokens JWT (Obrigatório em prod)
jwt.secret=${JWT_SECRET}