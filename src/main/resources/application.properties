spring.application.name=GuiaJuridicoBack

#CLEAN CONSOLE
logging.level.root=WARN
logging.level.com.seupacote=INFO
spring.main.banner-mode=off



spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/guia_juridico_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:Lmsf2019!}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Dialect auto-selected by Hibernate 6; explicit setting deprecated
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Chave secreta para assinatura dos tokens JWT
jwt.secret=${JWT_SECRET:Q2xhcmEtw6ktYS1tZWxob3ItcGVzc29hLWRvLW11bmRv}

# Habilita a inicialização preguiçosa para acelerar o startup
spring.main.lazy-initialization=true
server.port=${PORT:${SERVER_PORT:8080}}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# HikariCP base
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
# não falha o startup se a conexão inicial não for possível
spring.datasource.hikari.initializationFailTimeout=${SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT:-1}

# JPA/Hibernate: reduzir metadata no startup
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

# Disable Open Session In View to avoid lazy-load during view rendering
spring.jpa.open-in-view=false
