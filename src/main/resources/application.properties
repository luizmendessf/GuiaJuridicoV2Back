spring.application.name=GuiaJuridicoBack

#CLEAN CONSOLE
logging.level.root=WARN
logging.level.com.seupacote=INFO
spring.main.banner-mode=off



spring.datasource.url=jdbc:mysql://localhost:3306/guia_juridico_db
spring.datasource.username=admin
spring.datasource.password=Lmsf2019!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Chave secreta para assinatura dos tokens JWT
jwt.secret=Q2xhcmEtw6ktYS1tZWxob3ItcGVzc29hLWRvLW11bmRv

# Habilita a inicialização preguiçosa para acelerar o startup
spring.main.lazy-initialization=true

# HikariCP: evitar conexões iniciais desnecessárias e reduzir overhead
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# JPA: otimizações de produção
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Actuator: saúde e prontidão para evitar timeouts de deploy
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true